<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#132632"><title>百合快门 V2.23 · 两章完整版</title><link rel="stylesheet" href="css/game.css"></head>
<body><main id="app"><canvas id="arena" aria-label="游戏战场"></canvas>
<section id="hud" class="hud"><div class="hud-top"><div class="hp-panel"><div class="hp-label"><span>✿ 生命值</span><b id="hp-label">120/120</b></div><div class="health-track"><div id="hp-fill"></div></div><div class="boost-track"><div id="boost-fill"></div></div><div class="boost-text">◈ 超载能量 <span id="charge-value">0%</span></div></div><div class="wave-panel"><b id="wave-label">WAVE 01 / 16</b><small id="wave-kills">击败 0</small><small id="score-label">得分 0</small></div></div><button class="pause-mini" id="pause" aria-label="暂停">Ⅱ</button><div id="banner" class="banner"></div><div class="wave-progress"><div id="wave-progress-fill"></div></div></section>
<div id="boss-hud" hidden><div id="boss-phase">妖王 · 苏醒</div><div class="boss-track"><div id="boss-health"></div></div></div><div id="touch-help"><span>按住任意位置滑动 · 移动</span></div><div id="joystick"><div id="stick-knob"></div></div>
<button type="button" id="dev-wave9" hidden aria-hidden="true"></button><div id="fox-status" hidden></div>
<div id="skills"><button id="dash" class="skill" aria-label="冲刺"><b>➤</b><small>闪避</small><i class="cool" id="dash-cool"></i></button><button id="burst" class="skill" aria-label="超载"><b>✧</b><small>超载</small><i class="cool" id="burst-cool"></i></button><button id="bomb" class="skill primary" aria-label="百合定格"><b>✿</b><small id="bomb-count">定格×1</small></button></div>
<div id="shade"><article class="modal" id="modal"></article></div>
<div id="story-video-layer" hidden><video id="story-video" playsinline webkit-playsinline muted preload="auto"></video><div id="story-video-hint">轻触跳过</div><button type="button" id="story-video-skip" aria-label="跳过剧情视频">跳过</button></div>
<div id="error" hidden></div>
</main><script src="js/assets.js"></script><script src="assets/audio/music_data.js"></script><script src="js/game.js"></script></body></html>
